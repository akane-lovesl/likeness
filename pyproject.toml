[project]
name = "likeness"
version = "0.2.0"
description = "Likeness: a personal image studio you talk to. A phone-shaped web app, and the studio server that does the work."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private, personal use" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "segno>=1.6",
]

[project.scripts]
likeness = "likeness.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx2>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["likeness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
