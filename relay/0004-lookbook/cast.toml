# The Lookbook's example people: eight people who do not exist, each with three looks and every angle of the first.
# Read by  uv run likeness examples  (likeness/examples.py). Each look is a part and a style the app offers
# (web/js/looks/vocab.js); the studio is asked for it in the app's own words. Who they are is described, never named
# after anyone: these are invented faces.

[style]
portrait = """A photorealistic editorial portrait of an invented person who does not exist: {who}. Head and shoulders, \
the whole head and hair in frame with a little space above it, looking straight into the camera with a calm, open \
expression. Soft, even daylight from a large window on the left, an 85 mm lens at f/2.8, natural skin texture with \
pores and fine hairs, no retouched gloss, no jewellery, plain clothes. A seamless paper backdrop in {backdrop}. \
Vertical 3:4 framing. No text, no watermark."""

[[person]]
id = "ama"
name = "Ama"
who = "a woman in her late twenties with deep brown skin, high cheekbones and shoulder-length natural coils, worn loose"
backdrop = "warm sand"
looks = [["colour", "honey"], ["lips", "berry"], ["lashes", "wing"]]

